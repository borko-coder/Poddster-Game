<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Podcast Tycoon">
  <meta name="theme-color" content="#1b1430">
  <title>Podcast Tycoon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-row">
        <div class="stat" id="stat-cash" title="Cash">💰 <span id="cash">$0</span><small id="profit"></small></div>
        <div class="stat" id="stat-listeners" title="Listeners / capacity">🎧 <span id="listeners">0</span><small id="capacity"></small></div>
      </div>
      <div class="hud-row">
        <div class="stat" id="stat-staff" title="Staff housed / needed">👥 <span id="staff">0/0</span></div>
        <div class="stat" title="Day">📅 <span id="day">1</span></div>
        <div class="stat trend" title="Trending genre">🔥 <span id="trending"></span></div>
      </div>
      <div class="hud-row controls">
        <div class="speed" role="group" aria-label="Game speed">
          <button data-speed="0" aria-label="Pause">⏸</button>
          <button data-speed="1" aria-label="Normal speed">▶</button>
          <button data-speed="3" aria-label="Fast speed">⏩</button>
        </div>
        <div id="goal" class="goal"></div>
        <button id="menu-btn" aria-label="Menu">☰</button>
      </div>
    </header>

    <main id="board-wrap">
      <div id="board" aria-label="City map"></div>
    </main>

    <div id="hint" class="hint"></div>

    <nav id="toolbar" aria-label="Build menu"></nav>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <div id="sheet-backdrop" class="hidden"></div>
  <section id="sheet" class="hidden" role="dialog" aria-modal="true"></section>

  <script src="game.js"></script>
</body>
</html>
